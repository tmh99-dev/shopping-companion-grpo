name: CPU Harness tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest
      - run: python examples/demo_tools.py
      - run: python -m shopping_agent train --dry-run
      - run: python -m shopping_agent evaluate --help
      - run: python -m shopping_agent.validation
